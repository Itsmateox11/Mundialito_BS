name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # La base del CI es efímera: se crea, se migra y se descarta con el runner.
  DATABASE_URL: "file:./ci.db"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la base de datos
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm run test

      - name: Build
        run: npm run build
